# GitHub Dependabot: every week it opens a pull request for newer (and security-fixed) packages.
# The CI workflow (ci.yml) then builds and tests the pull request, so a bad update is caught before it is merged.
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: /desktop
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: cargo
    directory: /backend
    schedule: { interval: weekly }
  - package-ecosystem: pip
    directory: /backend/scan
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
