[project]
name = "omniguard-backend"
version = "0.1.0"
description = "OmniGuard AOCDS - one global environment for security, fyp1 and fyp2"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-dotenv>=1.0",
    # AI / models
    "onnxruntime>=1.18",
    "numpy>=1.26",
    "scipy>=1.13",
    # security (face scan, vault)
    "opencv-python>=4.9",
    "cryptography>=42",
    # fyp1 (malware, stego)
    "yara-python>=4.5",
    "pefile>=2023.2.7",
    "pillow>=10.3",
    "soundfile>=0.12",
    # alerts
    "pyttsx3>=2.90",
    # fyp2 (firewall, registry, system)
    "psutil>=5.9",
    "pywin32>=306; sys_platform == 'win32'",
]

[dependency-groups]
dev = [
    "maturin>=1.5",
    "pytest>=8",
    "ruff>=0.5",
]

[tool.uv]
package = false   # environment only: run from Backend/ so security, fyp1, fyp2, common import directly
default-groups = ["dev"]
